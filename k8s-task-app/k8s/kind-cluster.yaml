kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskapp
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose the frontend NodePort (30080) on the Windows host so the
      # browser can reach http://localhost:30080 without port-forwarding.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
