# Local/loopback connections (used by initdb, init.sql, health checks) trust.
local   all   all                     trust
host    all   all   127.0.0.1/32      trust
host    all   all   ::1/128           trust

# Every real (TCP) connection from other pods MUST authenticate with Kerberos.
# include_realm=0 strips @TASKAPP.LOCAL so principal "backend" maps to role "backend".
host    all   all   0.0.0.0/0         gss include_realm=0 krb_realm=TASKAPP.LOCAL
host    all   all   ::/0              gss include_realm=0 krb_realm=TASKAPP.LOCAL
