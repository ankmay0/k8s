[libdefaults]
    default_realm = TASKAPP.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # Do not let Kerberos rewrite the hostname via DNS. In-cluster we connect to
    # the service name "postgres", so the service principal is simply
    # postgres/postgres@TASKAPP.LOCAL (no reverse-DNS canonicalization).
    dns_canonicalize_hostname = false
    rdns = false

[realms]
    TASKAPP.LOCAL = {
        kdc = kerberos
        admin_server = kerberos
    }

[domain_realm]
    .taskapp.local = TASKAPP.LOCAL
    taskapp.local = TASKAPP.LOCAL
    # Map in-cluster DNS names (e.g. postgres.default.svc.cluster.local) to our
    # realm so libpq's FQDN-based service principal resolves to TASKAPP.LOCAL
    # instead of inventing a bogus cross-realm.
    .svc.cluster.local = TASKAPP.LOCAL
    .cluster.local = TASKAPP.LOCAL